name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not secret: this is the account's SSH endpoint, visible to anyone who has
  # cPanel access on this account. Only the private key actually grants entry.
  SSH_HOST: 66.29.148.182
  SSH_USER: lftoeuiwlb
  SSH_PORT: "21098"
  # amazinglashesandspa.com is an addon domain on this cPanel account, so its
  # document root is a dedicated folder rather than public_html.
  WEB_ROOT: /home/lftoeuiwlb/amazinglashesandspa.com/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key."
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to cPanel via rsync
        run: |
          rsync -avz --delete \
            --exclude 'cgi-bin' \
            --exclude '.well-known' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$WEB_ROOT"
